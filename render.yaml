services:
  - type: web
    name: carecompass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
